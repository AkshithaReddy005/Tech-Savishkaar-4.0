<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Previous Editions – Hexagon Gallery</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, sans-serif;
      color: #e5e7eb;
      background: radial-gradient(1200px 900px at 20% -10%, rgba(34, 211, 238, 0.20), transparent 60%),
                 radial-gradient(1000px 800px at 90% 10%, rgba(167, 139, 250, 0.16), transparent 60%),
                 linear-gradient(120deg, #070814, #0b1020);
    }
    .container { max-width: 1180px; margin: 0 auto; padding: 40px 24px; }
    .section-title { 
      font-family: 'Cormorant Garamond', ui-serif, Georgia, 'Times New Roman', serif;
      letter-spacing: 0.01em; font-weight: 800; font-size: clamp(1.8rem, 5vw, 2.2rem); 
      text-align: center; margin: 16px 0 4px;
    }
    .subtitle { text-align: center; color: rgba(231,234,243,0.8); margin-bottom: 20px; }

    /* Hexagon Gallery (computed honeycomb layout) */
    .hex-gallery-section { 
      position: relative; 
      padding: 12px 0 32px; 
      max-width: 1200px; 
      margin: 0 auto;
    }
    .hex-grid {
      position: relative;
      margin: 0 auto;
      width: 100%;
      /* height is set dynamically via script */
    }
    .hex {
      position: absolute;
      overflow: hidden;
      cursor: pointer;
      /* size and coordinates set via script */
      /* pointy-top hexagon */
      clip-path: polygon(50% 0%, 90% 25%, 90% 75%, 50% 100%, 10% 75%, 10% 25%);
    }
    
    .hex-in {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.06);
      background: radial-gradient(120% 100% at 50% 0%, rgba(34,211,238,0.06), transparent 60%),
                  radial-gradient(100% 100% at 50% 100%, rgba(167,139,250,0.06), transparent 60%),
                  rgba(15,23,42,0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .hex:focus-visible { outline: 2px solid rgba(34,211,238,0.8); outline-offset: 4px; }
    .hex-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: saturate(0.96) contrast(1.02);
      transition: transform 0.25s ease, filter 0.25s ease;
    }
    .hex:hover .hex-in { transform: translateY(-4px); box-shadow: 0 14px 36px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.08); }
    .hex:hover .hex-img { transform: scale(1.04); filter: saturate(1.05) contrast(1.05); }

    .back-link { display: inline-flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: rgba(231,234,243,0.94);
      text-decoration: none; font-weight: 650; font-size: 0.95rem; }
    .back-link:hover { transform: translateY(-2px); box-shadow: 0 16px 44px rgba(0,0,0,0.35); }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="/">← Back to site</a>
    <h1 class="section-title">Previous Editions Gallery</h1>
    <p class="subtitle">Hexagon layout preview (standalone). Add more images easily.</p>

    <section class="hex-gallery-section">
      <div id="hexGrid" class="hex-grid" aria-label="Hexagon gallery"></div>
    </section>
  </div>

  <script>
    // List of images with fallback to placeholder if not found
    const images = [
      '/domains/tech-savishkar-1.jpeg',
      '/domains/tech-savishkar-2.jpeg',
      '/domains/tech-savishkar-3.jpeg',
      '/domains/tech-savishkar-4.jpeg',
      '/domains/tech-savishkar-5.jpeg',
      '/domains/tech-savishkar-6.jpeg',
      '/domains/tech-savishkar-7.jpeg',
      '/domains/tech-savishkar-8.jpeg',
      '/domains/tech-savishkar-9.jpeg',
      '/domains/tech-savishkar-10.jpeg',
      '/domains/tech-savishkar-11.jpeg',
      '/domains/tech-savishkar-12.jpeg',
      '/domains/tech-savishkar-13.jpeg',
      '/domains/tech-savishkar-14.jpeg',
      '/domains/tech-savishkar-15.jpeg'
    ];

    // Placeholder image for missing files
    const placeholder = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iNTAwIiB2aWV3Qm94PSIwIDAgNTAwIDUwMCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iIzFhMWQyYiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0ibW9ub3NwYWNlIiBmb250LXNpemU9IjE0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBhbGlnbm1lbnQtYmFzZWxpbmU9Im1pZGRsZSIgZmlsbD0iI2ZmZiI+UHJldmlldyBub3QgYXZhaWxhYmxlPC90ZXh0Pjwvc3ZnPg==';

    const grid = document.getElementById('hexGrid');
    images.forEach((src, idx) => {
      const alt = (src.split('/').pop() || `image-${idx}`).replace(/[-_]/g, ' ').replace(/\.[a-zA-Z0-9]+$/, '')
      const img = new Image()
      img.src = src
      img.onerror = () => {
        btn.querySelector('.hex-img').style.backgroundImage = `url(${placeholder})`
        btn.querySelector('.hex-img').style.opacity = '0.5'
      }
      const btn = document.createElement('button');
      btn.className = 'hex';
      btn.type = 'button';
      btn.setAttribute('aria-label', `Preview ${alt}`);
      btn.innerHTML = '<div class="hex-in"><div class="hex-img"></div></div>';
      btn.querySelector('.hex-img').style.backgroundImage = `url(${src})`;
      btn.addEventListener('click', () => window.open(src, '_blank'));
      grid.appendChild(btn);
    });

    function layoutHoneycomb() {
      const nodes = Array.from(grid.children);
      const containerWidth = grid.clientWidth;
      if (!containerWidth) return;

      // Target hex size; compute number of columns responsively
      const targetW = 180; // base desired width
      // On wide screens, force 4 columns for a consistent desktop look
      let cols = containerWidth >= 800 ? 4 : Math.max(2, Math.floor(containerWidth / targetW));
      // account for half hex offset on odd rows so everything fits
      let w = Math.floor(containerWidth / (cols + 0.5));
      if (w < 130) { // Slightly increased minimum size
        cols = Math.max(1, cols - 1);
        w = Math.floor(containerWidth / (cols + 0.5));
      }

      // Taller hexagons with pointy top (1.3x height multiplier)
      const h = Math.round(w * 1.3);
      const vStep = Math.round(h * 0.75); // vertical step for interlock

      nodes.forEach((el, i) => {
        const row = Math.floor(i / cols);
        const col = i % cols;
        const x = Math.round(col * w + (row % 2 ? w / 2 : 0));
        const y = Math.round(row * vStep);
        const hex = el;
        hex.style.width = w + 'px';
        hex.style.height = h + 'px';
        hex.style.left = x + 'px';
        hex.style.top = y + 'px';
        hex.style.visibility = 'visible';
      });

      const rows = Math.ceil(nodes.length / cols);
      const totalHeight = rows * vStep + (rows ? (h - vStep) : 0);
      grid.style.height = totalHeight + 'px';
    }

    // Initial layout and on resize
    layoutHoneycomb();
    window.addEventListener('resize', () => {
      // debounce
      clearTimeout((window)._hexLayoutT);
      (window)._hexLayoutT = setTimeout(layoutHoneycomb, 80);
    });
  </script>
</body>
</html>
